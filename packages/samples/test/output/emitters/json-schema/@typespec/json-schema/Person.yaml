$schema: https://json-schema.org/draft/2020-12/schema
$id: Person.yaml
type: object
properties:
  firstName:
    type: string
    description: The person's first name.
  lastName:
    type: string
    description: The person's last name.
  age:
    type: integer
    minimum: 0
    maximum: 2147483647
    description: Age in years, which must be zero or greater.
  address:
    $ref: Address.yaml
    description: The person's address.
  nickNames:
    type: array
    items:
      type: string
    uniqueItems: true
    description: The person's nicknames.
  cars:
    type: array
    items:
      $ref: Car.yaml
    description: Cars owned by the person.
required:
  - firstName
  - lastName
  - age
  - address
