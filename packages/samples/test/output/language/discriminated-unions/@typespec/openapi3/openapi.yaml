openapi: 3.0.0
info:
  title: Widget Service
  version: 0.0.0
tags: []
paths:
  /{id}:
    get:
      operationId: read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    HeavyWidget:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - Heavy
      allOf:
        - $ref: '#/components/schemas/WidgetBase'
    LightWidget:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - Light
      allOf:
        - $ref: '#/components/schemas/WidgetBase'
    Widget:
      type: object
      oneOf:
        - $ref: '#/components/schemas/WidgetHeavy'
        - $ref: '#/components/schemas/WidgetLight'
      discriminator:
        propertyName: kind
        mapping:
          heavy: '#/components/schemas/WidgetHeavy'
          light: '#/components/schemas/WidgetLight'
    WidgetBase:
      type: object
      required:
        - id
        - weight
        - color
      properties:
        id:
          type: string
        weight:
          type: integer
          format: int32
        color:
          type: string
          enum:
            - red
            - blue
    WidgetHeavy:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - heavy
        value:
          $ref: '#/components/schemas/HeavyWidget'
    WidgetKind:
      type: string
      enum:
        - Heavy
        - Light
    WidgetLight:
      type: object
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - light
        value:
          $ref: '#/components/schemas/LightWidget'
