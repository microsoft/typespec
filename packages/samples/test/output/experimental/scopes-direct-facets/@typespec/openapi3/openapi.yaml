openapi: 3.0.0
info:
  title: (title)
  version: 0.0.0
tags: []
paths:
  /:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: expand
          in: query
          required: false
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
components:
  schemas:
    Versions:
      type: string
      enum:
        - v1
        - v2
    Views:
      type: string
      enum:
        - read
        - write
    Widget:
      type: object
      required:
        - value
      properties:
        value:
          type: string
