jobs:
  - job: sign_vs
    displayName: Sign
    pool:
      name: $(LINUXPOOL)
      image: $(LINUXVMIMAGE)
      os: linux

    steps:
      - checkout: self

      - download: current
        artifact: vs-extension-unsigned
        displayName: Download VS extension(.vsix) from pipeline artifacts

      - template: /eng/tsp-core/pipelines/templates/sign-vsix.yml
        parameters:
          path: $(Pipeline.Workspace)/vs-extension-unsigned
          pattern: "*.vsix"

    templateContext:
      outputs:
        - output: pipelineArtifact
          path: $(Pipeline.Workspace)/vs-extension-unsigned
          artifact: vs-extension-signed
          displayName: Publish signed VS extension

  - job: publish_vs
    displayName: Publish
    dependsOn: sign_vs
    pool:
      name: $(WINDOWSPOOL)
      image: $(WINDOWSVMIMAGE)
      os: windows

    steps:
      - checkout: self

      - download: current
        artifact: vs-extension-signed
        displayName: Download VS extension(.vsix) from pipeline artifacts

      - task: PublishVisualStudioExtension@5
        displayName: Publish
        inputs:
          connectTo: AzureRM
          connectedServiceNameAzureRM: azure-sdk-vsmarketplace
          vsixFile: $(Pipeline.Workspace)/vs-extension-signed/Microsoft.Typespec.VS.vsix
          manifestFile: $(Build.SourcesDirectory)/packages/typespec-vs/publishManifest.json
          publisherId: typespec
          ignoreWarnings: VSIXValidatorWarning01,VSIXValidatorWarning02,VSIXValidatorWarning08
