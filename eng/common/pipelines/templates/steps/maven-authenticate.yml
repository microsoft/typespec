parameters:
  SourceDirectory: $(Build.SourcesDirectory)

steps:
  # Copy mirror settings to default Maven location so all requests go through CFS
  - pwsh: |
      $m2Dir = if ($env:USERPROFILE) { "$env:USERPROFILE\.m2" } else { "$HOME/.m2" }
      $mavenRepositoryPath = Join-Path $m2Dir "repository"
      New-Item -ItemType Directory -Force -Path $mavenRepositoryPath | Out-Null
      Write-Host "##vso[task.setvariable variable=MavenRepositoryPath]$mavenRepositoryPath"
      Copy-Item -Path "${{ parameters.SourceDirectory }}/eng/settings.xml" -Destination "$m2Dir/settings.xml"
    displayName: "Setup Maven mirror settings"

  # Cache artifacts only; settings.xml contains feed credentials.
  # Include the stage so test jobs can save dependencies absent from build caches.
  - task: Cache@2
    displayName: "Cache Maven repository"
    inputs:
      key: '"maven" | "$(Agent.OS)" | "$(System.StageName)" | ${{ parameters.SourceDirectory }}/**/pom.xml'
      restoreKeys: |
        "maven" | "$(Agent.OS)" | "$(System.StageName)"
        "maven" | "$(Agent.OS)"
      path: $(MavenRepositoryPath)

  # Authenticate with Azure Artifacts feeds
  # MavenAuthenticate adds <server> entries to ~/.m2/settings.xml matching mirror id 'azure-sdk-for-java'
  - task: MavenAuthenticate@0
    displayName: "Maven Authenticate"
    inputs:
      artifactsFeeds: "azure-sdk-for-java"
