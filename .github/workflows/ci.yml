name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/*
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-slim
    outputs:
      core: ${{ steps.core-filter.outputs.core }}
      python: ${{ steps.python-filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cspell:ignore dorny
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: core-filter
        with:
          predicate-quantifier: "every"
          filters: |
            core:
              - '**'
              - '!.prettierignore'
              - '!.prettierrc.json'
              - '!cspell.yaml'
              - '!eslint.config.json'
              - '!.chronus/**'
              - '!eng/emitters/**'
              - '!packages/http-client-csharp/**'
              - '!packages/http-client-java/**'
              - '!packages/http-client-python/**'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: python-filter
        with:
          filters: |
            python:
              - 'packages/http-client-python/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-python.yml'

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core-ci.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/ci-python.yml

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-slim
    if: "!cancelled() || contains(needs.*.result, 'cancelled')"
    needs: [core, python]
    steps:
      - name: Validate CI results
        run: |
          if [[ "${{ needs.core.result }}" == "failure" || "${{ needs.core.result }}" == "cancelled" ]]; then
            echo "Core CI failed or was cancelled"
            exit 1
          fi
          if [[ "${{ needs.python.result }}" == "failure" || "${{ needs.python.result }}" == "cancelled" ]]; then
            echo "Python CI failed or was cancelled"
            exit 1
          fi
          echo "All CI checks passed or were appropriately skipped"
