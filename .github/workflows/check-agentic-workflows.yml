name: Check Agentic Workflows

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"
      - ".github/workflows/check-agentic-workflows.yml"

jobs:
  check-lock-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c # v0.88.7
        with:
          version: v0.88.7

      - name: Compile and check for drift
        run: |
          gh aw compile
          # Restore dependabot.yml — gh aw compile reformats it even without --dependabot (known bug)
          git checkout -- .github/dependabot.yml 2>/dev/null || true
          if ! git diff --exit-code .github/workflows/*.lock.yml; then
            echo "::error::Lock files are out of date. Run 'gh aw compile' locally and commit the changes."
            exit 1
          fi
