name: Python CI Template

on:
  workflow_call:
    inputs:
      check:
        description: Python check to run.
        required: true
        type: string
      runner:
        description: GitHub runner image.
        required: false
        type: string
        default: ubuntu-latest
      use-typespec-azure:
        description: Check out Azure/typespec-azure and point its core submodule at this TypeSpec commit.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.check }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout TypeSpec repo
        if: ${{ !inputs.use-typespec-azure }}
        uses: actions/checkout@v7

      - name: Checkout Azure/typespec-azure repo
        if: ${{ inputs.use-typespec-azure }}
        uses: actions/checkout@v7
        with:
          repository: Azure/typespec-azure
          submodules: recursive

      - name: Update core submodule to TypeSpec commit
        if: ${{ inputs.use-typespec-azure }}
        env:
          TYPESPEC_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          TYPESPEC_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          cd core
          git remote add typespec "https://github.com/$TYPESPEC_REPOSITORY.git"
          git fetch typespec "$TYPESPEC_REF"
          git checkout "$TYPESPEC_REF"

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-python

      - name: Download generated artifacts
        if: inputs.check != 'build'
        uses: actions/download-artifact@v8
        with:
          name: python-generated
          path: .

      - name: Build and pack http-client-python from PR
        if: inputs.use-typespec-azure && inputs.check == 'build'
        run: |
          cd core/packages/http-client-python
          npm install --ignore-scripts
          npm run build
          npm pack

      - name: Override http-client-python with PR version
        if: inputs.use-typespec-azure && inputs.check == 'build'
        run: |
          HCP_TGZ=$(ls core/packages/http-client-python/typespec-http-client-python-*.tgz)
          node -e '
            const pkg = require("./packages/typespec-python/package.json");
            const fs = require("fs");
            pkg.dependencies["@typespec/http-client-python"] = "file:../../" + process.argv[1];
            fs.writeFileSync("./packages/typespec-python/package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$HCP_TGZ"

      - name: Install integration dependencies
        if: inputs.use-typespec-azure && (inputs.check == 'build' || inputs.check == 'test')
        run: pnpm install --no-frozen-lockfile

      - name: Install integration Python package dependencies
        if: inputs.use-typespec-azure && (inputs.check == 'typecheck' || inputs.check == 'lint' || inputs.check == 'docs')
        run: pnpm install --no-frozen-lockfile --filter "@azure-tools/typespec-python..."

      - name: Install TypeSpec repo dependencies
        if: ${{ !inputs.use-typespec-azure }}
        run: pnpm install

      - name: Install local http-client-python dependencies
        if: ${{ !inputs.use-typespec-azure }}
        run: npm install --ignore-scripts
        working-directory: packages/http-client-python

      - name: Setup local http-client-python
        if: ${{ !inputs.use-typespec-azure }}
        run: npm run setup
        working-directory: packages/http-client-python

      - name: Build integration typespec-python
        if: inputs.use-typespec-azure && (inputs.check == 'build' || inputs.check == 'windows-test')
        run: pnpm turbo run --filter "@azure-tools/typespec-python..." build

      - name: Build integration http-client-python from PR
        if: inputs.use-typespec-azure && inputs.check == 'windows-test'
        run: |
          npm install --ignore-scripts
          npm run build
        working-directory: core/packages/http-client-python

      - name: Build http-specs and azure-http-specs from source
        if: inputs.use-typespec-azure && inputs.check == 'build'
        # Build the mock servers from the checked-out typespec-azure (+ PR core)
        # source, so the mock stays in lockstep with the client that is
        # regenerated from the same source below. Previously these build outputs
        # were overwritten with the versions resolved via http-client-python's
        # package.json pin, which caused client/mock spec skew whenever
        # typespec-azure main advanced a spec beyond the pinned bundle and failed
        # otherwise-green PRs. See microsoft/typespec#11348.
        run: pnpm turbo run build --filter "@typespec/http-specs..." --filter "@azure-tools/azure-http-specs..."

      - name: Build integration spector
        if: inputs.use-typespec-azure && inputs.check == 'test'
        run: pnpm turbo run --filter "@typespec/spector..." build

      - name: Prepare integration Python environment
        if: inputs.use-typespec-azure
        run: pnpm run prepare
        working-directory: packages/typespec-python

      - name: Regenerate integration clients
        if: inputs.use-typespec-azure && inputs.check == 'build'
        run: pnpm run regenerate
        working-directory: packages/typespec-python

      - name: Regenerate local test clients
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'build' }}
        run: npm run regenerate
        working-directory: packages/http-client-python

      - name: Check local generated output
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'build' }}
        run: npm run check-unstaged
        working-directory: packages/http-client-python

      - name: Pre-build integration wheels
        if: inputs.use-typespec-azure && inputs.check == 'build'
        working-directory: packages/typespec-python
        run: |
          venv/bin/python tests/install_packages.py build azure tests
          venv/bin/python tests/install_packages.py build unbranded tests

      - name: Upload integration generated artifacts
        if: inputs.use-typespec-azure && inputs.check == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: python-generated
          path: |
            packages/typespec-python/tests/generated
            packages/typespec-python/tests/.wheels
            packages/typespec-python/dist
            packages/typespec-python/package.json
            core/packages/http-client-python/typespec-http-client-python-*.tgz
            core/packages/spector/dist
            core/packages/http-specs/dist
            packages/azure-http-specs/dist
          retention-days: 1

      - name: Upload local generated artifacts
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'build' }}
        uses: actions/upload-artifact@v7
        with:
          name: python-generated
          path: |
            packages/http-client-python/tests/generated
            packages/http-client-python/dist
            packages/http-client-python/generator/dist
          retention-days: 1

      - name: Test integration clients
        if: inputs.use-typespec-azure && inputs.check == 'test'
        run: pnpm run test:python:e2e
        working-directory: packages/typespec-python

      - name: Test local generated clients
        if: ${{ !inputs.use-typespec-azure && (inputs.check == 'test' || inputs.check == 'windows-test') }}
        run: npm run test:generator -- --env=test
        working-directory: packages/http-client-python

      - name: Typecheck integration clients
        if: inputs.use-typespec-azure && inputs.check == 'typecheck'
        run: pnpm run test:python:e2e --env mypy,pyright
        working-directory: packages/typespec-python

      - name: Typecheck local generated clients
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'typecheck' }}
        run: npm run test:generator -- --env=mypy,pyright
        working-directory: packages/http-client-python

      - name: Lint integration clients
        if: inputs.use-typespec-azure && inputs.check == 'lint'
        run: pnpm run test:python:e2e --env lint
        working-directory: packages/typespec-python

      - name: Lint integration source
        if: inputs.use-typespec-azure && inputs.check == 'lint'
        run: pnpm run lint:extra
        working-directory: packages/typespec-python

      - name: Format check integration source
        if: inputs.use-typespec-azure && inputs.check == 'lint'
        run: pnpm run format:extra:check
        working-directory: packages/typespec-python

      - name: Lint local generated clients
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'lint' }}
        run: npm run test:generator -- --env=lint
        working-directory: packages/http-client-python

      - name: Lint local source
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'lint' }}
        run: npm run lint
        working-directory: packages/http-client-python

      - name: Format check local source
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'lint' }}
        run: npm run format:check
        working-directory: packages/http-client-python

      - name: Validate integration docs
        if: inputs.use-typespec-azure && inputs.check == 'docs'
        run: pnpm run test:python:e2e --env apiview,sphinx
        working-directory: packages/typespec-python

      - name: Validate local docs
        if: ${{ !inputs.use-typespec-azure && inputs.check == 'docs' }}
        run: npm run test:generator -- --env=apiview,sphinx
        working-directory: packages/http-client-python
