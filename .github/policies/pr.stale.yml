id: pr.inactivity
name: GitOps.PullRequestIssueManagement
description: Manage Stale pull requests
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
      - description: Ping user when the PR has not been updated in 14 days
        frequencies:
          - daily:
              time: 13:0
        filters:
          - isPullRequest
          - isOpen
          - isNotLabeledWith:
              label: stale
          - noActivitySince:
              days: 14
        actions:
          - addLabel:
              label: stale
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                Your PR has had no update for 14 days and it is marked as a stale PR. If it is not updated within 14 additional days, the PR will automatically be closed.
                The `stale` label is removed automatically when you update or comment on your PR, or when a maintainer reviews it. You can also remove the label manually.

      - description: Close prs that have not been updated in 28 days
        frequencies:
          - daily:
              time: 13:0
        filters:
          - isPullRequest
          - isOpen
          - hasLabel:
              label: stale
          - noActivitySince:
              days: 14
        actions:
          - closeIssue
          - addReply:
              reply: >-
                Hi @${issueAuthor}.
                The PR will be closed since the PR has no update for 28 days. If this is still relevant please reopen.

    eventResponderTasks:
      - description: Remove the stale label when the PR author updates the PR
        if:
          - payloadType: Pull_Request
          - isActivitySender:
              issueAuthor: true
          - not:
              labelAdded:
                label: stale
          - hasLabel:
              label: stale
          - isOpen
        then:
          - removeLabel:
              label: stale

      - description: Remove the stale label when the PR author comments
        if:
          - payloadType: Issue_Comment
          - isPullRequest
          - isAction:
              action: Created
          - isActivitySender:
              issueAuthor: true
          - hasLabel:
              label: stale
          - isOpen
        then:
          - removeLabel:
              label: stale

      - description: Remove the stale label when the PR author or a maintainer reviews the PR
        if:
          - or:
              - and:
                  - payloadType: Pull_Request_Review
                  - isAction:
                      action: Submitted
              - and:
                  - payloadType: Pull_Request_Review_Comment
                  - isAction:
                      action: Created
          - or:
              - isActivitySender:
                  issueAuthor: true
              - activitySenderHasAssociation:
                  association: Owner
              - activitySenderHasAssociation:
                  association: Member
              - activitySenderHasAssociation:
                  association: Collaborator
          - hasLabel:
              label: stale
          - isOpen
        then:
          - removeLabel:
              label: stale

onFailure:
onSuccess:
